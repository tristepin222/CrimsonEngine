name: Build and Release Engine

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86-64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libvulkan-dev \
            glslc \
            libgl1-mesa-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake \
            --build build \
            --config Release \
            --parallel

      - name: Run Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Assets
        run: |
          mkdir -p CrimsonEngine
          cp build/engine/libengine.so CrimsonEngine/ || true
          cp build/engine/editor CrimsonEngine/ || true
          cp build/engine/game_runtime CrimsonEngine/ || true
          if [ -d build/shaders ]; then
            cp -r build/shaders CrimsonEngine/
          fi
          if [ -d build/plugins ]; then
            mkdir -p CrimsonEngine/plugins
            find build/plugins -name "*.so" -exec cp {} CrimsonEngine/plugins/ \;
          fi
          tar -czf CrimsonEngine-Linux-x64.tar.gz CrimsonEngine

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: CrimsonEngine-Linux-x64.tar.gz

  build-windows-x64:
    name: Build Windows x86-64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          version: 'latest'
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path CrimsonEngine
          if (Test-Path build\engine\Release\engine.dll) { Copy-Item build\engine\Release\engine.dll CrimsonEngine\ }
          if (Test-Path build\engine\Release\editor.exe) { Copy-Item build\engine\Release\editor.exe CrimsonEngine\ }
          if (Test-Path build\engine\Release\game_runtime.exe) { Copy-Item build\engine\Release\game_runtime.exe CrimsonEngine\ }
          if (Test-Path build\shaders) { Copy-Item -Recurse -Force build\shaders CrimsonEngine\ }
          if (Test-Path build\plugins) {
              New-Item -ItemType Directory -Force -Path CrimsonEngine\plugins
              Get-ChildItem -Path build\plugins -Filter *.dll -Recurse | Copy-Item -Destination CrimsonEngine\plugins\
          }
          Compress-Archive -Path CrimsonEngine -DestinationPath CrimsonEngine-Windows-x64.zip

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: CrimsonEngine-Windows-x64.zip

  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          version: 'latest'
          cache: true

      - name: Generate Vulkan SDK ARM64 Lib
        shell: powershell
        run: |
          # 1. Locate Vulkan SDK paths
          $vulkanDir = Get-ChildItem -Path "C:\VulkanSDK" -Directory | Select-Object -First 1
          $vulkanLib = "$($vulkanDir.FullName)\Lib\vulkan-1.lib"
          $vulkanArm64Dir = "$($vulkanDir.FullName)\Lib-ARM64"
          
          # 2. Locate MSVC tools (lib.exe and dumpbin.exe)
          $msvcDir = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Directory | Select-Object -First 1
          $binPath = "$($msvcDir.FullName)\bin\Hostx64\x64"
          $libExe = "$binPath\lib.exe"
          $dumpbinExe = "$binPath\dumpbin.exe"
          
          echo "Vulkan SDK Lib: $vulkanLib"
          echo "MSVC Bin Path: $binPath"
          
          # 3. Dump symbols from x64 vulkan-1.lib
          echo "Dumping exports from x64 Vulkan library..."
          $symbols = & $dumpbinExe /linkermember $vulkanLib
          
          # 4. Parse symbols starting with "vk"
          $exports = $symbols | ForEach-Object {
              if ($_ -match '^\s+[0-9a-fA-F]+\s+(vk[A-Za-z0-9_]+)$') {
                  $Matches[1]
              }
          } | Sort-Object -Unique
          
          echo "Found $($exports.Count) Vulkan export symbols."
          
          # 5. Write .def file
          $defContent = @("LIBRARY vulkan-1", "EXPORTS") + $exports
          $defContent | Out-File -FilePath vulkan-1.def -Encoding ascii
          
          # 6. Generate the native ARM64 vulkan-1.lib
          echo "Generating native ARM64 import library..."
          New-Item -ItemType Directory -Force -Path $vulkanArm64Dir
          & $libExe /def:vulkan-1.def /out:"$vulkanArm64Dir\vulkan-1.lib" /machine:ARM64
          
          echo "Successfully generated ARM64 library at $vulkanArm64Dir\vulkan-1.lib"

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package Assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path CrimsonEngine
          if (Test-Path build\engine\Release\engine.dll) { Copy-Item build\engine\Release\engine.dll CrimsonEngine\ }
          if (Test-Path build\engine\Release\editor.exe) { Copy-Item build\engine\Release\editor.exe CrimsonEngine\ }
          if (Test-Path build\engine\Release\game_runtime.exe) { Copy-Item build\engine\Release\game_runtime.exe CrimsonEngine\ }
          if (Test-Path build\shaders) { Copy-Item -Recurse -Force build\shaders CrimsonEngine\ }
          if (Test-Path build\plugins) {
              New-Item -ItemType Directory -Force -Path CrimsonEngine\plugins
              Get-ChildItem -Path build\plugins -Filter *.dll -Recurse | Copy-Item -Destination CrimsonEngine\plugins\
          }
          Compress-Archive -Path CrimsonEngine -DestinationPath CrimsonEngine-Windows-ARM64.zip

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: CrimsonEngine-Windows-ARM64.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64

      - name: Download Windows x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64

      - name: Download Windows ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64

      - name: Extract CMake Version
        id: get_version
        run: |
          VERSION=$(grep -oP 'project\(EngineWorkspace\s+VERSION\s+\K[0-9.]+' CMakeLists.txt)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.get_version.outputs.VERSION }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Skipping release creation."
          else
            echo "Fetching merged PR description..."
            PR_BODY=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].body' || echo "")
            if [ "$PR_BODY" = "null" ] || [ -z "$PR_BODY" ]; then
              PR_BODY="Automated release of Crimson Engine $TAG_NAME"
            fi
            echo "$PR_BODY" > release_notes.txt

            echo "Creating new release for $TAG_NAME..."
            gh release create "$TAG_NAME" \
              CrimsonEngine-Linux-x64.tar.gz \
              CrimsonEngine-Windows-x64.zip \
              CrimsonEngine-Windows-ARM64.zip \
              --title "Release $TAG_NAME" \
              --notes-file release_notes.txt \
              --target "${{ github.sha }}"
          fi
